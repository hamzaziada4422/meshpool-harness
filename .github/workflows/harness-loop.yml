# The harness loop: every day (and on demand) the routed harnesses race the base agent on the same tasks, with the
# same cheap model, at the same hour, graded by code. A regression fails the run; every run's table is kept on the
# loop-history branch so the trend is visible. Needs the repository secrets MESHPOOL_API_KEY and MESHPOOL_BASE_URL.
name: harness-loop
on:
  schedule:
    - cron: "30 12 * * *"        # 12:30 UTC: DeepSeek off-peak (peak is 01-04 and 06-10 UTC on weekdays)
  workflow_dispatch:
    inputs:
      arms:
        description: "Arms (base, routed, routed-fast, pi, codex)"
        default: "base,routed"
      suites:
        description: "Suites (chat, debug, build)"
        default: "chat,debug,build"
      budget:
        description: "Stop starting tasks above this estimated spend (USD)"
        default: "1.50"
      model:
        description: "Model for every arm (blank: the MH_MODEL repository variable, else deepseek-v4.1-flash)"
        default: ""
      fast_model:
        description: "Fast model for the routed-fast arm's chat lane"
        default: ""
concurrency:
  group: harness-loop
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MESHPOOL_API_KEY: ${{ secrets.MESHPOOL_API_KEY }}
      MESHPOOL_BASE_URL: ${{ secrets.MESHPOOL_BASE_URL }}
      MH_MODEL: ${{ inputs.model || vars.MH_MODEL || 'deepseek-v4.1-flash' }}
      MH_HOME: ${{ github.workspace }}/.mhhome
    steps:
      - uses: actions/checkout@v4
      - name: Key present
        run: |
          if [ -z "$MESHPOOL_API_KEY" ]; then
            echo "::error::Add the MESHPOOL_API_KEY (and MESHPOOL_BASE_URL) repository secrets to run the loop."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-cli.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python packages
        run: pip install -r packaging/requirements-cli.txt ruff
      - name: Run the loop
        id: loop
        run: |
          set +e
          python testkit/loop/bench.py \
            --arms "${{ inputs.arms || 'base,routed' }}" \
            --suites "${{ inputs.suites || 'chat,debug,build' }}" \
            --budget "${{ inputs.budget || '1.50' }}" \
            --fast-model "${{ inputs.fast_model }}" \
            --out loop-out
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat loop-out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-loop-${{ github.run_id }}
          path: loop-out
      - name: Keep the run on the loop-history branch
        run: |
          stamp=$(date -u +%Y-%m-%dT%H%M)
          git config user.name "harness-loop"
          git config user.email "harness-loop@users.noreply.github.com"
          git fetch origin loop-history || true
          if git rev-parse --verify origin/loop-history >/dev/null 2>&1; then
            git worktree add hist origin/loop-history
          else
            git worktree add --detach hist && (cd hist && git checkout --orphan loop-history && git rm -rqf .)
          fi
          mkdir -p hist/runs
          cp loop-out/summary.md "hist/runs/$stamp-$MH_MODEL.md"
          cp loop-out/results.jsonl "hist/runs/$stamp-$MH_MODEL.jsonl"
          (cd hist && ls -1 runs/*.md | sort -r | sed 's/^/- /' > INDEX.md && git add -A \
            && git commit -qm "loop $stamp $MH_MODEL" && git push origin HEAD:loop-history)
      - name: Fail on a regression
        if: steps.loop.outputs.code != '0'
        run: |
          echo "::error::The routed harnesses solved fewer tasks than the base agent. See the summary."
          exit 1
