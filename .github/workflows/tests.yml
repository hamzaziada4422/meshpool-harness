# Tests on every pull request and on main: the checks the pull request view (and GitHub) show for each change.
name: tests
# Actions minutes are limited: tests run only when started by hand (before a release) or when main changes. Not on
# every pull-request push: agent branches push many times a day. Run docs/plan/ci_local.sh locally first.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "testkit/**", ".github/workflows/harness-loop.yml"]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # one place for Chromium: the install step and the app under test (which only sets a default) both use it
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/pw-browsers
      # The app itself never uses a LibreOffice found on the computer (it ships its own). The tests run from a source
      # checkout on a runner with the apt LibreOffice below, so they opt in to that copy.
      MH_ALLOW_SYSTEM_SOFFICE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-cli.txt
      - name: LibreOffice and fonts (decks and workbooks are rendered and recalculated in the tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc libreoffice-impress libreoffice-writer fonts-crosextra-carlito fonts-dejavu poppler-utils
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          # the same packages the app ships with (install.sh and the desktop builds use this file)
          pip install -r packaging/requirements-cli.txt playwright pytest
      - name: Chromium for browser use (the app installs it with meshpool install-browser)
        run: python -m playwright install --with-deps chromium
      - name: Segoe UI's stand-in for rendering (decks are measured with the bundled Selawik, as on a user's computer)
        run: |
          mkdir -p ~/.local/share/fonts ~/.config/fontconfig
          cp app/engines/forge/fonts/Selawik-*.ttf ~/.local/share/fonts/
          printf '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">\n<fontconfig><alias><family>Segoe UI</family><prefer><family>Selawik</family></prefer></alias></fontconfig>\n' > ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null
          fc-match "Segoe UI"
      - name: The Mac builds of every package and program need macOS 11 or less (reads the real wheels; no Mac needed)
        # app/tests/test_macos_floor.py holds the repository to packaging/mac/verified_minos.json; this re-reads what is
        # published today, so a wheel that changed upstream is caught here and not in a release build.
        run: |
          python packaging/mac/wheel_minos.py closure -r packaging/requirements-cli.txt -c packaging/mac/constraints.txt
          python packaging/mac/wheel_minos.py programs
      - name: Tests
        working-directory: app
        run: python -m pytest -q -p no:cacheprovider tests
