# Builds the Mac apps and the Windows installer on GitHub's machines and publishes them as a release.
# Publish a release on GitHub (tag vX.Y.Z matching app/meshpool_harness/__init__.py), or run this workflow by hand;
# the builds attach Meshpool.dmg, Meshpool-Intel.dmg, Meshpool-Setup.exe, update-manifest.json and SHA256SUMS.txt to the release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Build only: windows (2x minutes, shakes out packaging first), mac (10x), linux, or both (all platforms). Publishing needs both. linux-publish: build Linux and attach it to the current version's public release (main only). probe: only report which macOS runners this repository is given."
        type: choice
        options: [windows, mac, linux, both, linux-publish, probe]
        default: windows

permissions:
  contents: write

# One build at a time: a newer push waits for the running one, then replaces its files
concurrency:
  group: ${{ inputs.platforms == 'probe' && 'release-probe' || 'release' }}     # a probe never waits behind a build
  cancel-in-progress: false

env:
  PI_VERSION: "1.5.2"
  HERMES_COMMIT: b6b53c69a6ed49cb099cf1bfe76b5e6edd718e5a
  RUNTIME_EXTRAS: "pywebview playwright"
  GH_TOKEN: ${{ github.token }}

jobs:
  mac-probe:
    # Which GitHub-hosted macOS runners this repository is actually given (a job no runner takes is cancelled after
    # about 15 minutes). Prints the machine only.
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'probe'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel, macos-26-intel]   # arm64 pool and the separate Intel pool
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: uname -m; sw_vers; sysctl -n hw.ncpu; df -h / | tail -1

  mac:
    # One job per architecture, each on a runner of its own CPU, so every app is built and smoke-tested natively.
    # Intel runs on GitHub's Intel pool. Apple silicon runs on the arm64 pool, which since November 2026 often gives no
    # runner at all ("not acquired by Runner of type hosted", cancelled after 15 minutes, see docs/plan/CI_LOCAL.md):
    # that leg may fail without stopping the release, and the publish step then ships the Intel app for Apple silicon
    # too (it runs under Rosetta; the updater moves those Macs to the native app once a release has it).
    if: github.event_name == 'release' || inputs.platforms == 'mac' || inputs.platforms == 'both'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, plat: mac-x64, runner: macos-15-intel, dmg: Meshpool-Intel, pbs: x86_64-apple-darwin, rt: rt-macx64, wheels: x86_64, clang: x86_64}
          # Apple silicon on two pools at once: whichever gets a runner and passes supplies Meshpool.dmg (on Nov 19
          # macos-26 answered within minutes while macos-15 never did). The app targets macOS 11 on either.
          - {arch: arm64, plat: mac-arm64, runner: macos-26, dmg: Meshpool, pbs: aarch64-apple-darwin, rt: rt-mac, wheels: arm64, clang: arm64}
          - {arch: arm64, plat: mac-arm64, runner: macos-15, dmg: Meshpool, pbs: aarch64-apple-darwin, rt: rt-mac, wheels: arm64, clang: arm64}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    timeout-minutes: 150          # the Intel runner has 4 slower cores; one app is still about an hour
    env:
      MAC_ARCHS: ${{ matrix.arch }}       # repack.sh and sign.sh work on this architecture's app only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Third-party runtimes
        run: |
          set -euo pipefail
          echo "runner: $(uname -m), macOS $(sw_vers -productVersion)"
          [ "$(uname -m)" = "${{ matrix.clang }}" ] || { echo "this runner is $(uname -m), not ${{ matrix.clang }}"; exit 1; }
          # every network fetch is retried: one server timing out (seen: kernel.org) must not cost a whole release
          retry() { local i; for i in 1 2 3 4; do "$@" && return 0; echo "retry $i/4 in $((i * 15)) s: $*"; sleep $((i * 15)); done; return 1; }
          mkdir -p deps && cd deps
          PBS=$(retry gh release view --repo astral-sh/python-build-standalone --json tagName -q .tagName)
          assets=$(retry gh release view "$PBS" --repo astral-sh/python-build-standalone --json assets -q '.assets[].name')
          asset=$(printf '%s\n' "$assets" | grep -E "^cpython-3\.12\.[0-9]+\+[0-9]+-${{ matrix.pbs }}-install_only\.tar\.gz$" | head -1)
          retry gh release download "$PBS" --repo astral-sh/python-build-standalone -p "$asset" --clobber
          mkdir -p "${{ matrix.rt }}" && tar -xzf "$asset" -C "${{ matrix.rt }}" && rm "$asset"
          PY="${{ matrix.rt }}/python/bin/python3"
          clone_hermes() { rm -rf vendor-hermes; git -c core.autocrlf=false clone -q https://github.com/NousResearch/hermes-agent vendor-hermes; }
          retry clone_hermes
          (cd vendor-hermes && git checkout -q "$HERMES_COMMIT" && git apply --ignore-whitespace ../../packaging/hermes-acp-server.patch && rm -rf .git)
          "$PY" ../packaging/hermes_requirements.py vendor-hermes > hermes-req.txt
          # cryptography stopped shipping Intel Mac builds after 48.0.1; use that on Intel rather than compile from source
          if [ "${{ matrix.arch }}" = x64 ]; then sed -i '' 's/^cryptography==.*/cryptography==48.0.1/' hermes-req.txt; fi
          # The Mac apps open on macOS 11 and later. Anything pip has to compile targets 11 too.
          MACOSX_DEPLOYMENT_TARGET=11.0 retry "$PY" -m pip install -q --retries 10 --timeout 60 --prefer-binary \
            -c ../packaging/mac/constraints.txt -r ../packaging/requirements-cli.txt -r hermes-req.txt $RUNTIME_EXTRAS
          "$PY" ../packaging/mac/old_macos_wheels.py "${{ matrix.wheels }}" 11.0
          CURL=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30)
          sums=$(retry "${CURL[@]}" https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt)
          NODE=$(printf '%s\n' "$sums" | grep -oE 'node-v22\.[0-9.]+-darwin-arm64\.tar\.gz' | head -1 | sed 's/-darwin-arm64.tar.gz//')
          retry "${CURL[@]}" -o node.tar.gz "https://nodejs.org/dist/latest-v22.x/$NODE-darwin-${{ matrix.arch }}.tar.gz"
          mkdir -p "node-mac-${{ matrix.arch }}" && tar -xzf node.tar.gz -C "node-mac-${{ matrix.arch }}" --strip-components=1 && rm node.tar.gz
          mkdir -p pi && retry npm install --prefix pi --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION" >/dev/null
      - name: Build the app tree
        run: python3 packaging/build_all.py --only=${{ matrix.plat }}
      - name: Check the app tree before signing and the disk image (fails in minutes, not after an hour)
        run: |
          set -euo pipefail
          rm -rf deps/download-cache; df -h . | tail -1          # the downloads are unpacked by now; disk is tight
          APP=dist-src/app-mac-${{ matrix.arch }}/Meshpool.app
          # a link that points nowhere or outside the app makes `codesign --verify --strict` reject the whole app
          bad=$(find "$APP" -type l \( ! -exec test -e {} \; -o -lname '/*' \) -print)
          [ -z "$bad" ] || { echo "links that codesign rejects:"; echo "$bad"; exit 1; }
          # the pruned LibreOffice draws a deck, recalculates a workbook and converts a document, in the app's own Python
          R=$APP/Contents/Resources
          "$R/python/bin/python3" packaging/verify_lo_prune.py "$R/app/vendor/libreoffice/LibreOffice.app/Contents/MacOS/soffice"
      - name: Launcher, sign, disk image
        env:
          # Signing and notarization. Empty until the owner's Apple Developer account is set up; sign.sh then does
          # nothing and the app stays ad hoc-signed, so the build works either way.
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          a=${{ matrix.arch }}; arch=${{ matrix.clang }}; min=11.0
          # The oldest macOS the app opens on is 11 (MIN_MACOS in packaging/build_all.py stamps the same into Info.plist).
          # Node 22, Playwright's driver and LibreOffice run on 11. Playwright's Chromium (159) needs macOS 13, so browser
          # use says so on older Macs (bundled.browser_needs_newer_macos) and Chromium is the one exemption.
          # The Apple silicon ffmpeg (imageio-ffmpeg's build, read from the file) needs macOS 12: converting audio and video
          # says so on an older Mac (bundled.ffmpeg_needs_newer_macos); speech to text decodes with PyAV and runs on 11.
          # Every other file, the new Python packages included, must pass at 11 (app/tests/test_macos_floor.py reads them).
          exempt=(--exempt 'Contents/Resources/app/vendor/browsers/*=13.0' --exempt 'Contents/Resources/app/vendor/ffmpeg/*=12.0')
          # without a minimum, clang targets the build machine's macOS and Finder shows the app crossed out on older ones
          clang -O2 -arch $arch -mmacosx-version-min=$min -o dist-src/app-mac-$a/Meshpool.app/Contents/MacOS/Meshpool packaging/mac/launcher/main.c
          # Playwright's own Node needs macOS 13.5; it runs on the app's Node 22 (macOS 11) instead
          D=dist-src/app-mac-$a/Meshpool.app/Contents/Resources/python/lib/python3.12/site-packages/playwright/driver
          if [ -f "$D/node" ]; then rm "$D/node" && ln -s ../../../../../../node/bin/node "$D/node"; fi
          grep -q "LSMinimumSystemVersion</key><string>$min</string>" dist-src/app-mac-$a/Meshpool.app/Contents/Info.plist || { echo "Info.plist does not say macOS $min"; exit 1; }
          python3 packaging/mac/check_minos.py dist-src/app-mac-$a/Meshpool.app $min --arch $arch "${exempt[@]}"
          bash packaging/mac/repack.sh "$PWD/dist-src"
          ls -la dist-src/out
      - name: Smoke test the disk image (what a user downloads) before anything is published
        # normally a few minutes; a hang must not burn the job
        timeout-minutes: 30
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/meshpool_harness/__init__.py)
          f=${{ matrix.dmg }}
          T=$(mktemp -d)
          MNT=$(hdiutil attach -nobrowse -readonly "dist-src/out/$f.dmg" | awk '/Volumes/{print substr($0, index($0,"/Volumes"))}')
          ditto "$MNT/Meshpool.app" "$T/Meshpool.app"
          for try in 1 2 3 4; do
            if hdiutil detach -quiet "$MNT"; then break; fi
            if [ "$try" = 4 ]; then hdiutil detach -force "$MNT"; else sleep $((try * 5)); fi
          done
          R="$T/Meshpool.app/Contents/Resources"
          echo "== $f.dmg on $(uname -m)"
          "$R/python/bin/python3" packaging/smoke.py --app "$R/app" --version "$VER"
          # the pruned LibreOffice (packaging/lo_prune.py) must still draw a deck, recalculate a workbook and convert a document
          "$R/python/bin/python3" packaging/verify_lo_prune.py "$R/app/vendor/libreoffice/LibreOffice.app/Contents/MacOS/soffice"
          # the pruned Hermes (bundled_tools.hermes_ignore) must still start its ACP adapter and finish a turn against a mock model
          "$R/python/bin/python3" packaging/verify_hermes_prune.py "$R/app/vendor/hermes"
          rm -rf "$T"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-${{ matrix.runner }}
          path: dist-src/out/${{ matrix.dmg }}.dmg

  windows:
    if: github.event_name == 'release' || inputs.platforms == 'windows' || inputs.platforms == 'both'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # Secrets cannot be read in an "if" condition, so the signing steps test this copy of the endpoint instead.
      # Empty until the owner's Azure account is set up; the signing steps are then skipped and the build still works.
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Third-party runtimes
        run: |
          set -euo pipefail
          # every network fetch is retried: one server timing out (seen: kernel.org) must not cost a whole release
          retry() { local i; for i in 1 2 3 4; do "$@" && return 0; echo "retry $i/4 in $((i * 15)) s: $*"; sleep $((i * 15)); done; return 1; }
          mkdir -p deps && cd deps
          PBS=$(retry gh release view --repo astral-sh/python-build-standalone --json tagName -q .tagName)
          assets=$(retry gh release view "$PBS" --repo astral-sh/python-build-standalone --json assets -q '.assets[].name')
          asset=$(printf '%s\n' "$assets" | grep -E '^cpython-3\.12\.[0-9]+\+[0-9]+-x86_64-pc-windows-msvc-install_only\.tar\.gz$' | head -1)
          retry gh release download "$PBS" --repo astral-sh/python-build-standalone -p "$asset" --clobber
          mkdir -p rt-win && tar -xzf "$asset" -C rt-win && rm "$asset"
          clone_hermes() { rm -rf vendor-hermes; git -c core.autocrlf=false clone -q https://github.com/NousResearch/hermes-agent vendor-hermes; }
          retry clone_hermes
          (cd vendor-hermes && git checkout -q "$HERMES_COMMIT" && git apply --ignore-whitespace ../../packaging/hermes-acp-server.patch && rm -rf .git)
          rt-win/python/python.exe ../packaging/hermes_requirements.py vendor-hermes > hermes-req.txt
          retry rt-win/python/python.exe -m pip install -q --retries 10 --timeout 60 -r ../packaging/requirements-cli.txt -r hermes-req.txt $RUNTIME_EXTRAS
          CURL=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30)
          sums=$(retry "${CURL[@]}" https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt)
          NODE=$(printf '%s\n' "$sums" | grep -oE 'node-v22\.[0-9.]+-win-x64\.zip' | head -1)
          retry "${CURL[@]}" -o node.zip "https://nodejs.org/dist/latest-v22.x/$NODE"
          python -m zipfile -e node.zip . && mv "${NODE%.zip}" node-win && rm node.zip
          # MinGit: build_all.py fetches the pinned, checksum-verified zip (packaging/bundled_tools.py)
          mkdir -p pi && retry npm install --prefix pi --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION" >/dev/null
          mkdir -p win/Meshpool
          # Meshpool.exe carries the version: rewrite winres.json from __version__ and recompile its resource here,
          # so a release never needs a Windows PC for this step.
          (cd .. && python packaging/build_all.py --winres)
          go install github.com/tc-hib/go-winres@v0.3.3
          (cd ../packaging/win/launcher && "$(go env GOPATH)/bin/go-winres" make --arch amd64)
          (cd ../packaging/win/launcher && GOOS=windows GOARCH=amd64 go build -ldflags=-H=windowsgui -o ../../../deps/win/Meshpool/Meshpool.exe .)
      - name: Build the app tree
        run: python packaging/build_all.py --only=win
      - name: Smoke test the app the installer will carry, before anything is published
        timeout-minutes: 15      # normally about 2 minutes; a hang must not run until the job's timeout
        shell: bash
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/meshpool_harness/__init__.py)
          M=dist-src/app-win/Meshpool
          "$M/runtime/python.exe" packaging/smoke.py --app "$M/app" --version "$VER"
          # the pruned LibreOffice (packaging/lo_prune.py) must still draw a deck, recalculate a workbook and convert a document
          "$M/runtime/python.exe" packaging/verify_lo_prune.py "$M/app/vendor/libreoffice/program/soffice.exe"
          # the pruned Hermes (bundled_tools.hermes_ignore) must still start its ACP adapter and finish a turn against a mock model
          "$M/runtime/python.exe" packaging/verify_hermes_prune.py "$M/app/vendor/hermes"
      - name: Sign the launcher and the app files
        # Signs Meshpool.exe (the Go launcher) and everything else in the app tree that Windows checks, before the
        # installer is built. Skipped when the Azure secrets are not set, so the build works before the account exists.
        if: env.AZURE_SIGNING_ENDPOINT != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist-src\app-win
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Signing tools for the uninstaller
        # The uninstaller is generated while makensis runs, so it cannot go through the action above; this puts
        # signtool and the Artifact Signing dlib on the machine for !uninstfinalize to use.
        if: env.AZURE_SIGNING_ENDPOINT != ''
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: packaging/win/sign-setup.ps1
      - name: Installer
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # NSIS: from Chocolatey, tried a few times (its feed times out now and then), else straight from SourceForge
          MAKENSIS="$(command -v makensis || true)"
          [ -n "$MAKENSIS" ] || [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ] || MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          for try in 1 2 3; do
            [ -n "$MAKENSIS" ] && break
            choco install nsis -y --no-progress && [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ] && MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe" && break
            echo "Chocolatey could not install NSIS (attempt $try)"; sleep $((try * 20))
          done
          if [ -z "$MAKENSIS" ]; then
            curl -fsSL --retry 4 -o nsis.zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip"
            python -m zipfile -e nsis.zip nsis-dl && MAKENSIS="$PWD/nsis-dl/nsis-3.11/makensis.exe"
          fi
          [ -x "$MAKENSIS" ] || { echo "NSIS could not be installed"; exit 1; }
          cd dist-src/app-win
          # The uninstaller is written on the user's machine by WriteUninstaller, which leaves no chance to sign it.
          # So write it here first (uninstaller.nsi), sign it, and ship the signed copy with File instead.
          if [ -n "${AZURE_SIGNING_ENDPOINT:-}" ]; then
            "$MAKENSIS" -V2 -DMP_UNINSTALLER_OUT="$PWD/UninstallMeshpool.exe" uninstaller.nsi
            # The generator writes the uninstaller when it runs, not when it is compiled.
            ./Meshpool-Uninstaller-Generator.exe
            [ -f UninstallMeshpool.exe ] || { echo "the uninstaller was not written"; exit 1; }
            pwsh -NoProfile -NonInteractive -File "$GITHUB_WORKSPACE/packaging/win/sign-file.ps1" \
              -File "$PWD/UninstallMeshpool.exe" -Description "Meshpool Uninstall"
            "$MAKENSIS" -V2 -DMP_SIGNED_UNINSTALLER="$PWD/UninstallMeshpool.exe" installer.nsi
          else
            "$MAKENSIS" -V2 installer.nsi
          fi
          cd "$GITHUB_WORKSPACE"
          mkdir -p out && cp "dist-src/app-win/Meshpool Setup.exe" out/Meshpool-Setup.exe
      - name: Sign the installer
        if: env.AZURE_SIGNING_ENDPOINT != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}\out\Meshpool-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Check the signature
        # Windows' own verdict. A build that fails here is not published.
        if: env.AZURE_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sig = Get-AuthenticodeSignature "out/Meshpool-Setup.exe"
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne "Valid") { throw "Meshpool-Setup.exe is not validly signed ($($sig.Status))" }
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { throw "signtool.exe was not found" }
          & $st.FullName verify /pa /v "out/Meshpool-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/Meshpool-Setup.exe

  linux:
    # Linux x64: one folder (Meshpool/) packed as Meshpool-Linux-x64.tar.gz. Built on Ubuntu 22.04, so it runs on glibc
    # 2.35 and later. Before anything is published it is unpacked in a bare Ubuntu 22.04 container that has only the
    # system libraries a desktop has (no LibreOffice, Chromium, Node, Git or Python of its own), and
    # packaging/linux/selfcheck.py proves the app uses only the copies inside the folder.
    if: github.event_name == 'release' || inputs.platforms == 'linux' || inputs.platforms == 'linux-publish' || inputs.platforms == 'both'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Third-party runtimes
        run: |
          set -euo pipefail
          retry() { local i; for i in 1 2 3 4; do "$@" && return 0; echo "retry $i/4 in $((i * 15)) s: $*"; sleep $((i * 15)); done; return 1; }
          sudo apt-get update -q && sudo apt-get install -y -q libcurl4-openssl-dev zlib1g-dev   # to build Git
          mkdir -p deps && cd deps
          PBS=$(retry gh release view --repo astral-sh/python-build-standalone --json tagName -q .tagName)
          assets=$(retry gh release view "$PBS" --repo astral-sh/python-build-standalone --json assets -q '.assets[].name')
          asset=$(printf '%s\n' "$assets" | grep -E "^cpython-3\.12\.[0-9]+\+[0-9]+-x86_64-unknown-linux-gnu-install_only\.tar\.gz$" | head -1)
          retry gh release download "$PBS" --repo astral-sh/python-build-standalone -p "$asset" --clobber
          mkdir -p rt-linux && tar -xzf "$asset" -C rt-linux && rm "$asset"
          PY=rt-linux/python/bin/python3
          clone_hermes() { rm -rf vendor-hermes; git -c core.autocrlf=false clone -q https://github.com/NousResearch/hermes-agent vendor-hermes; }
          retry clone_hermes
          (cd vendor-hermes && git checkout -q "$HERMES_COMMIT" && git apply --ignore-whitespace ../../packaging/hermes-acp-server.patch && rm -rf .git)
          "$PY" ../packaging/hermes_requirements.py vendor-hermes > hermes-req.txt
          retry "$PY" -m pip install -q --retries 10 --timeout 60 --prefer-binary -r ../packaging/requirements-cli.txt -r hermes-req.txt $RUNTIME_EXTRAS
          CURL=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30)
          sums=$(retry "${CURL[@]}" https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt)
          NODE=$(printf '%s\n' "$sums" | grep -oE 'node-v22\.[0-9.]+-linux-x64\.tar\.gz' | head -1)
          retry "${CURL[@]}" -o node.tar.gz "https://nodejs.org/dist/latest-v22.x/$NODE"
          echo "$(printf '%s\n' "$sums" | grep " $NODE\$" | cut -d' ' -f1)  node.tar.gz" | sha256sum -c -
          mkdir -p node-linux-x64 && tar -xzf node.tar.gz -C node-linux-x64 --strip-components=1 && rm node.tar.gz
          mkdir -p pi && retry npm install --prefix pi --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION" >/dev/null
      - name: Build the app folder
        run: python3 packaging/build_all.py --only=linux
      - name: Check the folder (LibreOffice converts; nothing it needs is missing)
        run: |
          set -euo pipefail
          rm -rf deps/download-cache
          M=dist-src/app-linux/Meshpool
          "$M/python/bin/python3" -m compileall -q -j0 "$M/app" >/dev/null || true     # faster first start
          "$M/python/bin/python3" packaging/verify_lo_prune.py "$M/app/vendor/libreoffice/program/soffice"
          python3 packaging/lo_deps_check.py "$M/app/vendor/libreoffice" linux
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p out
          tar -C dist-src/app-linux -czf out/Meshpool-Linux-x64.tar.gz Meshpool
          (cd out && sha256sum Meshpool-Linux-x64.tar.gz > Meshpool-Linux-x64.tar.gz.sha256)
          ls -la out; rm -rf dist-src
      - name: Smoke test the download in a bare Ubuntu 22.04 (what a user unpacks) before anything is published
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/meshpool_harness/__init__.py)
          docker run --rm -v "$PWD:/w:ro" -e VER="$VER" ubuntu:22.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q >/dev/null
            # what a desktop has: the graphics, font and security libraries (no LibreOffice, Chromium, Node, Git, Python)
            apt-get install -y -q --no-install-recommends ca-certificates fontconfig libfreetype6 libnss3 libnspr4 \
              libx11-6 libx11-xcb1 libxcb1 libxext6 libxrender1 libxinerama1 libxrandr2 libxcomposite1 libxdamage1 \
              libxfixes3 libxkbcommon0 libsm6 libice6 libdbus-1-3 libglib2.0-0 libcups2 libavahi-client3 libcairo2 \
              libpango-1.0-0 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1 libasound2 libcurl4 >/dev/null
            for t in soffice libreoffice chromium chrome node git python3; do
              if command -v "$t" >/dev/null; then echo "this container has $t, so the check would prove nothing"; exit 1; fi
            done
            cd /tmp && tar -xzf /w/out/Meshpool-Linux-x64.tar.gz
            env -i HOME=/root PATH=/usr/bin:/bin LANG=C.UTF-8 /tmp/Meshpool/python/bin/python3 -P /w/packaging/linux/selfcheck.py /tmp/Meshpool
            env -i HOME=/root PATH=/usr/bin:/bin LANG=C.UTF-8 /tmp/Meshpool/python/bin/python3 /w/packaging/smoke.py --app /tmp/Meshpool/app --version "$VER"
            # `meshpool check` exits 1 here because no API key is set; what matters is where each tool comes from
            out=$(env -i HOME=/root PATH=/usr/bin:/bin /tmp/Meshpool/meshpool check || true); echo "$out"
            for t in "Git " "Node.js " "LibreOffice "; do
              echo "$out" | grep -E "\[ok\] $t.*/tmp/Meshpool/.*ships with Meshpool" >/dev/null || { echo "meshpool check: $t is not the bundled copy"; exit 1; }
            done
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            out/Meshpool-Linux-x64.tar.gz
            out/Meshpool-Linux-x64.tar.gz.sha256

  linux-attach:
    # Adds the Linux download to the CURRENT version's release once it is public (the version Linux joined after its
    # Mac and Windows files were published). Only the Linux file and its own checksum file are uploaded: the
    # installers, update-manifest.json and SHA256SUMS.txt that the Mac and Windows updaters check stay exactly as
    # published. From the next version on, Linux is part of the full release (publish, below).
    needs: [linux]
    if: inputs.platforms == 'linux-publish' && github.ref == 'refs/heads/main' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: built
      - name: Attach the Linux download
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/meshpool_harness/__init__.py)
          TAG="v$VER"
          gh release view "$TAG" --json isDraft -q .isDraft | grep -qx false || { echo "::error::$TAG is not a public release"; exit 1; }
          (cd built && sha256sum -c Meshpool-Linux-x64.tar.gz.sha256)
          gh release upload "$TAG" built/Meshpool-Linux-x64.tar.gz built/Meshpool-Linux-x64.tar.gz.sha256 --clobber
          gh release edit "$TAG" --notes-file packaging/release-notes.md
          mkdir -p check && gh release download "$TAG" --dir check --pattern 'Meshpool-Linux-x64.tar.gz*'
          (cd check && sha256sum -c Meshpool-Linux-x64.tar.gz.sha256)
          gh release view "$TAG" --json assets -q '.assets[].name' | sort

  publish:
    needs: [mac, windows, linux]
    # Only a full build publishes: a one-platform trial run builds and checks, and stops there. always(): the Apple
    # silicon leg of `mac` may end without a runner (see the mac job); what has to exist is checked below, by file.
    if: always() && (github.event_name == 'release' || inputs.platforms == 'both') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built          # one folder per artifact: windows/, mac-x64-macos-15-intel/, mac-arm64-macos-26/ ...
      - name: Check the builds
        run: |
          set -euo pipefail
          find built -type f | sort
          mkdir -p dist
          # Windows and the Intel Mac app are required: each exists only when its job built and smoke-tested it.
          [ -s built/windows/Meshpool-Setup.exe ] || { echo "::error::Meshpool-Setup.exe was not built, so nothing is published"; exit 1; }
          [ -s built/mac-x64-macos-15-intel/Meshpool-Intel.dmg ] || { echo "::error::Meshpool-Intel.dmg was not built, so nothing is published"; exit 1; }
          cp built/windows/Meshpool-Setup.exe built/mac-x64-macos-15-intel/Meshpool-Intel.dmg dist/
          # Apple silicon: the native app from whichever pool gave a runner and passed; else the Intel app, which runs
          # there under Rosetta (the updater moves those Macs to the native app once a release carries it).
          for d in built/mac-arm64-macos-26 built/mac-arm64-macos-15; do
            if [ -s "$d/Meshpool.dmg" ]; then cp "$d/Meshpool.dmg" dist/; echo "Apple silicon build from ${d#built/mac-arm64-}"; break; fi
          done
          # Linux: in the release when its job built and checked it (a failed Linux leg never stops Mac and Windows)
          if [ -s built/linux/Meshpool-Linux-x64.tar.gz ]; then
            cp built/linux/Meshpool-Linux-x64.tar.gz dist/
          else
            echo "::warning::No Linux build in this run (${{ needs.linux.result }}): this release has no Linux download."
          fi
          if [ ! -s dist/Meshpool.dmg ]; then
            echo "::warning::No Apple silicon build in this run (${{ needs.mac.result }}): Meshpool.dmg is the Intel app, which Apple silicon Macs run under Rosetta."
            cp dist/Meshpool-Intel.dmg dist/Meshpool.dmg
            printf '\n**Apple silicon Macs:** this release has no native Apple silicon build (GitHub had no Apple silicon runner for it), so Meshpool.dmg is the Intel app, which runs under Rosetta. The next release with a native build replaces it automatically.\n' >> packaging/release-notes.md
          fi
      - name: Attach to the release
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/meshpool_harness/__init__.py)
          TAG="v$VER"
          # the in-app code update installs this archive, checked against SHA256SUMS.txt
          git archive --format=tar.gz --prefix=meshpool-harness/ -o dist/Meshpool-src.tar.gz HEAD
          # update-manifest.json (docs/plan/AUTO_UPDATE.md): runtime_changed is true when a bundled program changed (the
          # packages the bundled Python gets (requirements-cli.txt, the Mac constraints, Hermes' requirements), the Hermes
          # patch, the LibreOffice, Chromium and Git pins in bundled_tools.py, the LibreOffice prune list), so the app
          # then uses the full installer instead of the in-place code update. Node and Pi are versioned in this workflow:
          # if you change them, also change one of the listed files.
          gh release download "$(gh release list --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')" \
            --pattern update-manifest.json --dir prev 2>/dev/null || true
          python3 packaging/updater/make_manifest.py --version "$VER" \
            --runtime-file packaging/requirements-pinned.txt --runtime-file packaging/requirements-runtime.txt \
            --runtime-file packaging/bundled_tools.py --runtime-file packaging/lo_prune.py \
            --runtime-file packaging/requirements-cli.txt --runtime-file packaging/mac/constraints.txt \
            --runtime-file packaging/hermes_requirements.py --runtime-file packaging/hermes-acp-server.patch \
            --previous prev/update-manifest.json -o dist/update-manifest.json
          LINUX=(); [ -s dist/Meshpool-Linux-x64.tar.gz ] && LINUX=(Meshpool-Linux-x64.tar.gz)
          (cd dist && sha256sum Meshpool.dmg Meshpool-Intel.dmg Meshpool-Setup.exe "${LINUX[@]}" Meshpool-src.tar.gz update-manifest.json > SHA256SUMS.txt)
          # Updates check every download against SHA256SUMS.txt, so a release users can see must never be half
          # uploaded or have its files swapped one by one (a new installer next to the old checksums fails every
          # update until the last file lands). A new version is built as a draft, which the updater ignores, and made
          # public only when every file is up. A version that is already public keeps its files: a rebuild only
          # refreshes the release page; changed code needs a new version number. (A release published by hand on
          # GitHub, which is what starts this workflow, has no files yet: it still gets them.)
          if gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null | grep -qx false \
             && gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx SHA256SUMS.txt; then
            echo "$TAG is already public: updating the release page only, its files stay as published."
            gh release edit "$TAG" --notes-file packaging/release-notes.md
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Meshpool $VER beta" --notes-file packaging/release-notes.md
          fi
          gh release edit "$TAG" --notes-file packaging/release-notes.md
          gh release upload "$TAG" dist/Meshpool.dmg dist/Meshpool-Intel.dmg dist/Meshpool-Setup.exe ${LINUX[@]/#/dist/} dist/Meshpool-src.tar.gz dist/update-manifest.json dist/SHA256SUMS.txt --clobber
          # every file is up and matches the checksums before anyone can see the release
          gh release view "$TAG" --json assets -q '.assets[].name' | sort > uploaded.txt
          printf '%s\n' Meshpool-Intel.dmg Meshpool-Setup.exe "${LINUX[@]}" Meshpool-src.tar.gz Meshpool.dmg SHA256SUMS.txt update-manifest.json | sed '/^$/d' | sort | diff - uploaded.txt
          mkdir -p check && gh release download "$TAG" --dir check --pattern 'SHA256SUMS.txt' --pattern 'Meshpool-src.tar.gz'
          (cd check && grep Meshpool-src.tar.gz SHA256SUMS.txt | sha256sum -c -)
          gh release edit "$TAG" --draft=false --latest
